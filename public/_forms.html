<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <title>Glowworks Forms</title>
  </head>
  <body>
    <form
      name="glowworks-appointment"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="glowworks-appointment" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="vehicle" />
      <input name="year" />
      <input name="service" />
      <input name="date" />
      <input name="time" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
